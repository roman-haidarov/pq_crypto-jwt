name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        ruby: ["3.1", "3.2", "3.3", "3.4", "4.0"]
        jwt-version: ["~> 3.1.0", "~> 3.2.0", "~> 3.3.0"]
    runs-on: ${{ matrix.os }}
    env:
      JWT_VERSION: ${{ matrix.jwt-version }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - if: failure()
        run: find vendor/bundle -name mkmf.log -exec tail -n 60 {} \;
      - run: bundle exec rake test

  jose-interop:
    runs-on: ubuntu-24.04
    env:
      JOSE_INTEROP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - if: failure()
        run: find vendor/bundle -name mkmf.log -exec tail -n 60 {} \;
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --no-save jose@^6
      - run: bundle exec ruby test/test_jose_interop.rb
